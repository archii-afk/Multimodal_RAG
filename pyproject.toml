[project]
name = "mmrag"
version = "0.1.0"
description = "Multimodal data management pipeline for RAG-ready systems (hackathon)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
  "openai>=1.40",
  # Pillow computes perceptual hashes for video frame deduplication.
  "Pillow>=10",
  # google-genai provides structured Gemini frame analysis and OCR.
  "google-genai>=1.0",
  # PyMuPDF extracts page-aware document text and offsets.
  "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mmrag = "mmrag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
